<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Lista de compras</title>
<meta name="theme-color" content="#f5f6f7" id="tc">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compras">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* ---------- Fontes e tema ---------- */
@font-face{font-family:Manrope;font-weight:500;font-style:normal;font-display:swap;src:url(fonts/manrope-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Manrope;font-weight:600;font-style:normal;font-display:swap;src:url(fonts/manrope-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Manrope;font-weight:800;font-style:normal;font-display:swap;src:url(fonts/manrope-latin-800-normal.woff2) format("woff2")}
:root{--bg:#f5f6f7;--surface:#fff;--ink:#16191c;--muted:#5f676e;--line:#e6e8ea;--accent:#0e7c66;--accent-ink:#fff;--soft:#e4f2ee;--warn:#c2410c;--shadow:0 -8px 24px rgba(0,0,0,.06);--cs:75%;--cl:92%;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111314;--surface:#1a1d1f;--ink:#eef0f1;--muted:#8b949b;--line:#2a2e31;--accent:#3ecfae;--accent-ink:#06231c;--soft:#173a32;--warn:#fb923c;--shadow:0 -8px 24px rgba(0,0,0,.4);--cs:32%;--cl:19%;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111314;--surface:#1a1d1f;--ink:#eef0f1;--muted:#8b949b;--line:#2a2e31;--accent:#3ecfae;--accent-ink:#06231c;--soft:#173a32;--warn:#fb923c;--shadow:0 -8px 24px rgba(0,0,0,.4);--cs:32%;--cl:19%;color-scheme:dark}

/* ---------- Base ---------- */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--ink);font:500 16px/1.4 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input::-webkit-calendar-picker-indicator{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* ---------- Cabeçalho ---------- */
header{flex:none;background:var(--bg);padding:14px 0 12px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px}
.lsb{display:flex;align-items:center;gap:6px;height:40px;margin-left:-8px;padding:0 8px;border-radius:12px;color:var(--muted);font-size:14px;font-weight:600;min-width:0;max-width:calc(100% - 48px)}
.lsb:hover{background:var(--line)}
.lsb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lsb i{font-style:normal;font-size:12px;flex:none}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:var(--ink)}
.icon-btn:hover{background:var(--line)}
.total{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:2px 0 6px;font-variant-numeric:tabular-nums}
.sub{display:flex;flex-wrap:wrap;column-gap:16px;row-gap:2px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.sub b{color:var(--ink);font-weight:600}
.bud{margin-top:12px}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .3s}
.bar.over i{background:var(--warn)}
.bud p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.bud.over p{color:var(--warn)}
.inst{display:flex;align-items:center;gap:8px;margin-top:12px;padding:8px 8px 8px 14px;border-radius:12px;background:var(--soft);font-size:14px;font-weight:600}
.inst span{flex:1}
.inst button{height:36px;padding:0 14px;border-radius:10px}
#instGo{background:var(--accent);color:var(--accent-ink);font-weight:800}
#instX{width:36px;padding:0;color:var(--muted)}

/* ---------- Lista ---------- */
main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:20px}
.grp{margin-top:18px}
.grp h2{display:flex;justify-content:space-between;margin:0 4px 8px;font-size:14px;font-weight:600;color:var(--muted)}
.card{background:hsl(var(--h) var(--cs) var(--cl));border:1px solid color-mix(in srgb,var(--ink) 10%,transparent);border-radius:16px;overflow:hidden}
.sw{position:relative}
.sw+.sw{border-top:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}
.sw.drag{background:var(--warn)}
.bin{position:absolute;right:22px;top:50%;width:22px;height:22px;margin-top:-11px;color:#fff}
.bin svg{width:100%;height:100%}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:6px 2px 6px 6px;min-height:60px;background:hsl(var(--h) var(--cs) var(--cl));touch-action:pan-y}
.row.zero{background:linear-gradient(color-mix(in srgb,#f97316 34%,transparent),color-mix(in srgb,#f97316 34%,transparent)),hsl(var(--h) var(--cs) var(--cl));box-shadow:inset 4px 0 0 #ea580c}
.zw{margin-right:6px}
.chk{width:44px;height:44px;flex:none;display:grid;place-items:center}
.chk span{width:24px;height:24px;border-radius:50%;border:2px solid color-mix(in srgb,var(--ink) 30%,transparent);display:grid;place-items:center;transition:.15s;color:transparent;font-size:14px;font-weight:800}
.done .chk span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.info{flex:1;min-width:0;text-align:left;padding:8px 0}
.info .name,.info .meta{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name{font-weight:600}
.meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pd{font-weight:800;margin-left:6px}
.pd.up{color:var(--warn)}
.pd.dn{color:var(--accent)}
.line{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.done .name,.done .line{text-decoration:line-through;color:var(--muted)}
.rm{width:40px;height:44px;flex:none;display:grid;place-items:center;margin-left:-6px;border-radius:12px;color:color-mix(in srgb,var(--ink) 45%,transparent);transition:color .15s,background .15s}
.rm svg{width:19px;height:19px}
.rm:hover,.rm:active{color:var(--warn);background:color-mix(in srgb,var(--ink) 7%,transparent)}
.row.out{opacity:0;transform:translateX(-12px);transition:opacity .18s,transform .18s}
.empty{text-align:center;color:var(--muted);padding:64px 24px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.more{display:block;margin:18px auto 0;padding:10px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:14px;font-weight:600}

/* ---------- Rodapé (formulário) ---------- */
footer{flex:none;position:relative;background:var(--surface);border-top:1px solid var(--line);box-shadow:var(--shadow);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px))}
.f{display:grid;gap:8px}
.f input,dialog input{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:0 12px;min-width:0;font-variant-numeric:tabular-nums}
.r1{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.r2{display:grid;grid-template-columns:auto minmax(0,1.15fr) minmax(0,1fr);gap:8px}
.nw,.pw,.kgw{position:relative}
.nw input{padding-right:44px}
.hb{position:absolute;right:0;top:0;width:44px;height:46px;color:var(--muted);font-size:16px}
.pw input{padding-right:46px}
.ub{position:absolute;right:5px;top:7px;width:36px;height:32px;border-radius:8px;font-size:12px;font-weight:800;color:var(--muted);background:color-mix(in srgb,var(--ink) 8%,transparent)}
.ub.kg{background:var(--soft);color:var(--accent)}
.qw>*{width:106px}
.kgw input{padding-right:34px}
.kgw .sx{position:absolute;right:12px;top:0;line-height:46px;font-size:14px;color:var(--muted);pointer-events:none}
.add{height:46px;padding:0 20px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:800}
.add:active{transform:scale(.97)}
.catb{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 10px;display:flex;align-items:center;gap:6px;min-width:0;font-weight:600;background:hsl(var(--h,0) var(--cs) var(--cl))}
.catb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catb .e{flex:none;overflow:visible;font-size:18px;line-height:1.4;padding:0 1px}
.bad{border-color:#ea580c!important;box-shadow:0 0 0 3px color-mix(in srgb,#f97316 30%,transparent)}
#prev:empty{display:none}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--bg);height:46px}
.step button{width:40px;height:100%;font-size:20px;flex:none}
.step output{flex:1;min-width:24px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- Janelas ---------- */
dialog{border:0;border-radius:20px 20px 0 0;background:var(--surface);color:var(--ink);padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-width:640px;margin:auto auto 0;box-shadow:0 -12px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{margin:0 0 14px;font-size:18px}
dialog h3:focus{outline:none}
dialog label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.acts{display:flex;gap:8px;margin-top:18px}
.acts button{flex:1;height:46px;border-radius:12px;font-weight:600;background:var(--bg)}
.acts .pri{background:var(--accent);color:var(--accent-ink);flex:2;font-weight:800}
.acts .dng{background:var(--warn);color:var(--surface);flex:2;font-weight:800}
.acts .del{color:var(--warn)}
.menu button{display:block;width:100%;text-align:left;padding:14px 4px;border-top:1px solid var(--line)}
.menu button.w{color:var(--warn)}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:0 14px;margin-top:8px;border-radius:12px;text-align:left;font-weight:600;background:hsl(var(--h) var(--cs) var(--cl));border:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}
.opt.plain{background:var(--bg)}
.opt.on{outline:2px solid var(--accent)}
.opt .e{font-size:20px;flex:none}
.opt .ln{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt em{margin-left:auto;flex:none;font-style:normal;color:var(--muted);font-weight:500;font-size:14px;font-variant-numeric:tabular-nums}
.lst{max-height:min(60vh,420px);overflow-y:auto}
.sec{background:hsl(var(--h) var(--cs) var(--cl));border:1px solid color-mix(in srgb,var(--ink) 10%,transparent);border-radius:14px;padding:12px;margin-top:10px}
.sec h4{margin:0 0 8px;font-size:14px}
.sg{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:999px;background:var(--surface);border:1px solid color-mix(in srgb,var(--ink) 12%,transparent);font-weight:600;font-size:14px}
.chip:active{transform:scale(.97)}
#hsl{max-height:70vh}
.seg{display:flex;gap:3px;padding:3px;height:46px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.seg button{flex:1;padding:0 8px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.eqr{display:flex;gap:8px}
.eqr .seg{flex:1}
.eqr .step,.eqr .kgw{width:140px;flex:none}

/* ---------- Aviso (toast) ---------- */
#toast{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:.25s;z-index:20;font-size:14px;white-space:nowrap;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toastTxt{overflow:hidden;text-overflow:ellipsis;min-width:0}
#toast button{flex:none;padding:4px 0;color:var(--accent);font-weight:800}

/* ---------- Ajustes de tela ---------- */
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:700px){.total{font-size:56px}}
@media (max-width:370px){.wrap{padding:0 12px}.total{font-size:38px}.add{padding:0 14px}.row{gap:10px}.qw>*{width:100px}.step button{width:36px}}
/* teclado aberto ou tela baixa: cabeçalho compacto para sobrar espaço para a lista */
@media (max-height:520px){header{padding:6px 0}.top .icon-btn,.lsb{height:32px}.total{font-size:30px;margin:0 0 2px}.inst,.bud p{display:none}.bud{margin-top:6px}.grp{margin-top:10px}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <button class="lsb" id="lsBtn" aria-label="Trocar de lista"><span id="lsName">Mercado</span><i aria-hidden="true">▾</i></button>
    <button class="icon-btn" id="menuBtn" aria-label="Mais opções">⋯</button>
  </div>
  <div class="total" id="total">R$ 0,00</div>
  <div class="sub">
    <span>No carrinho <b id="cart">R$ 0,00</b></span>
    <span>Falta <b id="rest">R$ 0,00</b></span>
    <span>Itens <b id="prog">0/0</b></span>
  </div>
  <div class="inst" id="inst" hidden><span>📲 Instale o app no seu aparelho</span><button id="instGo">Instalar</button><button id="instX" aria-label="Fechar aviso">✕</button></div>
  <div class="bud" id="bud" hidden><div class="bar" id="bar"><i></i></div><p id="budTxt"></p></div>
</div></header>

<main><div class="wrap" id="list"></div></main>

<footer><div class="wrap f">
  <div class="r1">
    <div class="nw"><input id="name" list="dl" placeholder="Item (ex.: Arroz 5 kg)" autocomplete="off" enterkeyhint="next" maxlength="120"><button class="hb" id="hBtn" aria-label="Sugestões de itens">▾</button></div>
    <button class="add" id="addBtn">Adicionar</button>
  </div>
  <datalist id="dl"></datalist>
  <div class="r2">
    <div class="qw">
      <div class="step" id="qStep"><button id="qm" aria-label="Diminuir">−</button><output id="qv">1</output><button id="qp" aria-label="Aumentar">+</button></div>
      <div class="kgw" id="kgw" hidden><input id="kg" inputmode="numeric" placeholder="Peso" autocomplete="off" enterkeyhint="next" aria-label="Peso em quilos"><span class="sx">kg</span></div>
    </div>
    <div class="pw"><input id="price" inputmode="numeric" placeholder="Preço" autocomplete="off" enterkeyhint="done" aria-label="Preço"><button class="ub" id="ub" type="button">/un</button></div>
    <button class="catb" id="cat" aria-label="Categoria"></button>
  </div>
  <div class="meta" id="prev"></div>
  <div id="toast" role="status" aria-live="polite"><span id="toastTxt"></span><button id="undo">Desfazer</button></div>
</div></footer>

<!-- Janelas (a ordem importa: as que abrem por cima de outras ficam depois) -->
<dialog id="ed">
  <h3 tabindex="-1" autofocus>Editar item</h3>
  <label for="en">Nome</label><input id="en" maxlength="120" enterkeyhint="done">
  <label>Quantidade</label>
  <div class="eqr">
    <div class="seg" id="eun"><button type="button" data-v="un">Unidade</button><button type="button" data-v="kg">Quilo</button></div>
    <div class="step" id="eStep"><button id="eqm" aria-label="Diminuir">−</button><output id="eqv">1</output><button id="eqp" aria-label="Aumentar">+</button></div>
    <div class="kgw" id="ekgw" hidden><input id="ekg" inputmode="numeric" placeholder="Peso" aria-label="Peso em quilos" enterkeyhint="done"><span class="sx">kg</span></div>
  </div>
  <label for="ep" id="epl">Preço unitário</label><input id="ep" inputmode="numeric" enterkeyhint="done">
  <label for="ec">Categoria</label><button class="catb" id="ec" type="button"></button>
  <div class="acts"><button class="del" id="edDel">Excluir</button><button class="pri" id="edSave">Salvar</button></div>
</dialog>

<dialog id="mn">
  <h3 tabindex="-1" autofocus>Opções</h3>
  <label for="bd">Orçamento desta lista (deixe vazio para desativar)</label>
  <input id="bd" inputmode="numeric" placeholder="0,00">
  <label>Tema</label>
  <div class="seg" id="thm"><button type="button" data-v="auto">Automático</button><button type="button" data-v="light">Claro</button><button type="button" data-v="dark">Escuro</button></div>
  <div class="menu" style="margin-top:14px">
    <button id="mInst">Instalar app</button>
    <button id="mExp">Exportar e compartilhar</button>
    <button id="mHide">Ocultar itens marcados</button>
    <button id="mDone" class="w">Remover itens marcados</button>
    <button id="mAll" class="w">Limpar a lista inteira</button>
  </div>
  <div class="acts"><button class="pri" id="mnOk">Pronto</button></div>
</dialog>

<dialog id="ls">
  <h3 tabindex="-1" autofocus>Minhas listas</h3>
  <div class="lst" id="lsl"></div>
  <div class="menu" style="margin-top:14px">
    <button id="lNew">+ Nova lista</button>
    <button id="lRen">Renomear esta lista</button>
    <button id="lDel" class="w">Excluir esta lista</button>
  </div>
  <div class="acts"><button class="pri" id="lsOk">Fechar</button></div>
</dialog>

<dialog id="ex">
  <h3 tabindex="-1" autofocus>Exportar e compartilhar</h3>
  <div class="menu">
    <button id="xShare" hidden>Compartilhar (WhatsApp, Telegram…)</button>
    <button id="xCopy">Copiar lista</button>
    <button id="xCsv">Baixar CSV</button>
    <button id="xXls">Baixar planilha (Excel)</button>
    <button id="xBak">Salvar backup de todas as listas (.json)</button>
    <button id="xRes">Restaurar backup</button>
    <input type="file" id="xFile" accept=".json,application/json" hidden>
  </div>
  <div class="acts"><button class="pri" id="xOk">Fechar</button></div>
</dialog>

<dialog id="cp"><h3 tabindex="-1" autofocus>Escolher categoria</h3><div class="lst" id="cpl"></div></dialog>
<dialog id="hs"><h3 tabindex="-1" autofocus>Sugestões de itens</h3><div class="lst" id="hsl"></div></dialog>
<dialog id="ih"><h3 tabindex="-1" autofocus id="ihT"></h3><p id="ihP" style="margin:0;line-height:1.5"></p><div class="acts"><button class="pri" id="ihOk">Entendi</button></div></dialog>

<dialog id="nm">
  <h3 id="nmT">Nova lista</h3>
  <input id="nmI" maxlength="40" placeholder="Ex.: Mercado, Farmácia, Churrasco" autocomplete="off" enterkeyhint="done" autofocus aria-labelledby="nmT">
  <div class="acts"><button id="nmNo">Cancelar</button><button class="pri" id="nmOk">Salvar</button></div>
</dialog>

<dialog id="ask">
  <h3 tabindex="-1" autofocus id="askT"></h3>
  <p id="askP" style="margin:0;line-height:1.5;color:var(--muted)"></p>
  <div class="acts"><button id="askNo">Cancelar</button><button class="pri" id="askOk">OK</button></div>
</dialog>

<script>
"use strict";

/* =========================================================
   Categorias
   ========================================================= */
const CATS = [["Hortifruti","🥬",125],["Padaria","🥖",42],["Açougue","🥩",355],["Laticínios","🧀",60],["Frios e Ovos","🥚",305],["Mercearia","🛒",270],["Bebidas","🥤",195],["Limpeza","🧹",160],["Higiene","🪥",250],["Congelados","❄️",220],["Snacks e Doces","🍪",335],["Pets","🐶",85],["Outros","📦",220,"6%"]]
  .map(([n, e, h, s]) => ({ n, e, h, s }));
const CAT = n => CATS.find(c => c.n === n) || CATS.find(c => c.n === "Outros");
const okc = n => CATS.some(c => c.n === n);
const sty = c => `--h:${c.h}${c.s ? ";--cs:" + c.s : ""}`;

/* =========================================================
   Utilidades
   ========================================================= */
const $ = id => document.getElementById(id);
const brl = c => (c / 100).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const fmtN = (n, d) => n.toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
const fromC = (c, z) => (c || z) ? fmtN(c / 100, 2) : "";
const digits = v => parseInt(String(v).replace(/\D/g, "") || "0", 10);
const cents = digits;                       // "4,50"  -> 450
const kilos = v => digits(v) / 1000;        // "0,750" -> 0.75
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s).trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ");
const slug = s => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "compras";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const vib = () => navigator.vibrate && navigator.vibrate(10);
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const plural = (n, um, varios) => n === 1 ? `1 ${um}` : `${n} ${varios}`;

// Máscaras de digitação: só números, vírgula automática
const maskMoney = el => el.addEventListener("input", () => {
  const d = el.value.replace(/\D/g, "").slice(0, 9);
  el.value = d ? fmtN(parseInt(d, 10) / 100, 2) : "";
});
const maskKg = el => el.addEventListener("input", () => {
  const d = el.value.replace(/\D/g, "").slice(0, 6);
  el.value = d && +d ? fmtN(parseInt(d, 10) / 1000, 3) : "";
});

// Itens
const isKg = i => i.unit === "kg";
const sub = i => Math.round(i.qty * i.price);
const sum = items => items.reduce((a, i) => a + sub(i), 0);
const qLabel = (q, u) => u === "kg" ? `${fmtN(q, 3)} kg` : `${q} un`;
const metaTxt = i => isKg(i) ? `${fmtN(i.qty, 3)} kg × ${brl(i.price)}/kg` : `${i.qty} × ${brl(i.price)}`;

/* =========================================================
   Estado (salvo no localStorage)
   ========================================================= */
const KEY = "lista-compras-v2", OLD_KEY = "lista-compras-v1";
const newList = name => ({ id: uid(), name, items: [], budget: 0, order: [] });

function cleanItem(i) {
  if (!i || typeof i !== "object") return null;
  const name = String(i.name || "").trim().slice(0, 120);
  if (!name) return null;
  const unit = i.unit === "kg" ? "kg" : "un";
  let qty = Number(i.qty);
  if (!Number.isFinite(qty) || qty <= 0) qty = 1;
  qty = unit === "kg" ? Math.max(.001, Math.round(Math.min(qty, 999) * 1000) / 1000) : Math.max(1, Math.min(999, Math.round(qty)));
  let price = Math.round(Number(i.price));
  if (!Number.isFinite(price) || price < 0) price = 0;
  const o = { id: i.id != null ? i.id : uid(), name, qty, price: Math.min(price, 1e9), unit, cat: okc(i.cat) ? i.cat : "Mercearia", done: !!i.done };
  const pp = Math.round(Number(i.pp));
  if (i.pp != null && Number.isFinite(pp) && pp >= 0) o.pp = pp;
  return o;
}
function cleanList(l) {
  const b = Math.round(Number(l.budget));
  return {
    id: l.id ? String(l.id) : uid(),
    name: String(l.name || "Lista").trim().slice(0, 40) || "Lista",
    items: (Array.isArray(l.items) ? l.items : []).map(cleanItem).filter(Boolean),
    budget: Number.isFinite(b) && b > 0 ? b : 0,
    order: Array.isArray(l.order) ? [...new Set(l.order.filter(okc))] : []
  };
}
// Aceita o formato atual (várias listas) e o antigo (uma lista só)
function cleanState(d) {
  if (!d || typeof d !== "object") throw new Error("inválido");
  let lists;
  if (Array.isArray(d.lists)) lists = d.lists.filter(l => l && typeof l === "object").map(cleanList);
  else if (Array.isArray(d.items)) lists = [cleanList({ name: "Mercado", items: d.items, budget: d.budget, order: d.order })];
  else throw new Error("inválido");
  if (!lists.length) lists = [newList("Mercado")];
  const hist = {};
  if (d.hist && typeof d.hist === "object") {
    for (const [k, h] of Object.entries(d.hist)) {
      if (h && typeof h.n === "string" && Number.isFinite(h.p))
        hist[k] = { n: h.n.slice(0, 120), p: Math.max(0, Math.round(h.p)), c: okc(h.c) ? h.c : "Mercearia", u: h.u === "kg" ? "kg" : "un", t: +h.t || 0 };
    }
  }
  return {
    lists,
    cur: lists.some(l => l.id === d.cur) ? d.cur : lists[0].id,
    hist,
    cat: okc(d.cat) ? d.cat : "Mercearia",
    theme: ["light", "dark"].includes(d.theme) ? d.theme : "auto",
    hideDone: !!d.hideDone
  };
}

let S;
try {
  const raw = localStorage.getItem(KEY) || localStorage.getItem(OLD_KEY);
  S = cleanState(raw ? JSON.parse(raw) : { lists: [] });
} catch (e) { S = cleanState({ lists: [] }); }

const L = () => S.lists.find(l => l.id === S.cur) || S.lists[0];
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const bump = c => { const l = L(); l.order = [c, ...l.order.filter(x => x !== c)]; };

// Histórico de preços: lembra o último preço, categoria e unidade de cada item
function remember(i) {
  S.hist[norm(i.name)] = { n: i.name, p: i.price, c: i.cat, u: i.unit, t: Date.now() };
  const keys = Object.keys(S.hist);
  if (keys.length > 300) keys.sort((a, b) => S.hist[a].t - S.hist[b].t).slice(0, keys.length - 300).forEach(k => delete S.hist[k]);
  fillDatalist();
}
const recent = () => Object.values(S.hist).sort((a, b) => b.t - a.t);
function fillDatalist() {
  $("dl").innerHTML = recent().slice(0, 200).map(h => `<option value="${esc(h.n)}"></option>`).join("");
}

/* =========================================================
   Tema
   ========================================================= */
const mqDark = matchMedia("(prefers-color-scheme: dark)");
function applyTheme() {
  const t = S.theme, root = document.documentElement;
  if (t === "auto") delete root.dataset.theme; else root.dataset.theme = t;
  const dark = t === "dark" || (t === "auto" && mqDark.matches);
  $("tc").content = dark ? "#111314" : "#f5f6f7";   // barra de status com a mesma cor do topo
  document.querySelectorAll("#thm button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === t));
}
mqDark.addEventListener("change", applyTheme);
$("thm").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  S.theme = b.dataset.v; applyTheme(); save();
});

/* =========================================================
   Janelas: fechar tocando fora, botão voltar do Android
   ========================================================= */
const DIALOGS = ["ed", "mn", "ls", "ex", "cp", "hs", "ih", "nm", "ask"];
const anyOpen = () => document.querySelector("dialog[open]");
let popSkip = 0;
if (history.state && history.state.dlg) history.replaceState(null, "");

function openD(id) {
  const d = $(id); if (d.open) return;
  d.showModal();
  if (!(history.state && history.state.dlg)) history.pushState({ dlg: 1 }, "");
}
DIALOGS.forEach(id => {
  const d = $(id);
  // Só fecha se o toque foi FORA da janela (no fundo escuro), não em espaços vazios dentro dela
  d.addEventListener("click", e => {
    if (e.target !== d) return;
    const r = d.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) d.close();
  });
  d.addEventListener("close", () => {
    if (!anyOpen() && history.state && history.state.dlg) { popSkip++; history.back(); }
  });
});
addEventListener("popstate", () => {
  if (popSkip) { popSkip--; if (anyOpen()) history.pushState({ dlg: 1 }, ""); return; }
  const open = [...document.querySelectorAll("dialog[open]")];
  if (open.length) {
    open[open.length - 1].close();
    if (anyOpen()) history.pushState({ dlg: 1 }, "");
  }
});
$("xOk").onclick = () => $("ex").close();
$("ihOk").onclick = () => $("ih").close();

/* =========================================================
   Aviso com "Desfazer"
   ========================================================= */
let undoFn = null, toastTimer;
function toast(msg, fn) {
  $("toastTxt").textContent = msg; undoFn = fn || null;
  $("undo").hidden = !fn;
  $("toast").classList.add("on");
  clearTimeout(toastTimer);

}

};

/* =========================================================
   Categoria (seletor)
   ========================================================= */
const paint = (el, n) => {
  const c = CAT(n);
  el.style.setProperty("--h", c.h); el.style.setProperty("--cs", c.s || "");
  el.innerHTML = `<span class="e">${c.e}</span><span>${c.n}</span>`; el.dataset.v = c.n;
};
let pickCb = null;
function pick(cur, cb) {
  pickCb = cb;
  $("cpl").innerHTML = CATS.map(c => `<button class="opt${c.n === cur ? " on" : ""}" style="${sty(c)}" data-c="${c.n}"><span class="e">${c.e}</span>${c.n}</button>`).join("");
  openD("cp");
}
$("cpl").addEventListener("click", e => {
  const b = e.target.closest("[data-c]");
  if (b) { $("cp").close(); pickCb && pickCb(b.dataset.c); }
});
$("cat").onclick = () => pick($("cat").dataset.v, n => { S.cat = n; paint($("cat"), n); save(); });
$("ec").onclick = () => pick($("ec").dataset.v, n => paint($("ec"), n));

["price", "ep", "bd"].forEach(id => maskMoney($(id)));
["kg", "ekg"].forEach(id => maskKg($(id)));
document.addEventListener("input", e => e.target.classList && e.target.classList.remove("bad"));
const bad = id => { $(id).classList.add("bad"); $(id).focus(); };

/* =========================================================
   Desenhar a tela
   ========================================================= */
const TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';

function rowHTML(i) {
  const diff = i.pp != null && i.price && i.price !== i.pp ? i.price - i.pp : 0;
  const pd = diff ? `<span class="pd ${diff > 0 ? "up" : "dn"}" title="Comparado com a última compra">${diff > 0 ? "▲" : "▼"} ${brl(Math.abs(diff))}</span>` : "";
  const warn = i.price ? "" : '<span class="zw" role="img" aria-label="Valor zerado">⚠️</span>';
  return `<div class="sw"><span class="bin">${TRASH}</span>
    <div class="row${i.done ? " done" : ""}${i.price ? "" : " zero"}" data-id="${esc(i.id)}">
      <button class="chk" data-t aria-pressed="${i.done}" aria-label="No carrinho: ${esc(i.name)}"><span>✓</span></button>
      <button class="info" data-e><span class="name">${esc(i.name)}</span><span class="meta">${metaTxt(i)}${pd}</span></button>
      <div class="line">${warn}${brl(sub(i))}</div>
      <button class="rm" data-d aria-label="Excluir ${esc(i.name)}">${TRASH}</button>
    </div></div>`;
}

function render() {
  const l = L(), its = l.items;
  const tot = sum(its), done = its.filter(i => i.done), cart = sum(done);
  $("lsName").textContent = l.name;
  $("total").textContent = brl(tot);
  $("cart").textContent = brl(cart);
  $("rest").textContent = brl(tot - cart);
  $("prog").textContent = `${done.length}/${its.length}`;

  const b = l.budget || 0;
  $("bud").hidden = !b;
  if (b) {
    const over = tot > b;
    $("bud").classList.toggle("over", over); $("bar").classList.toggle("over", over);
    $("bar").firstElementChild.style.width = Math.min(100, tot / b * 100) + "%";
    $("budTxt").textContent = over ? `Passou ${brl(tot - b)} do orçamento de ${brl(b)}` : `Sobram ${brl(b - tot)} do orçamento de ${brl(b)}`;
  }

  const box = $("list");
  if (!its.length) {
    box.innerHTML = '<div class="empty"><b>Sua lista está vazia</b>Digite um item abaixo, informe o preço e toque em Adicionar.</div>';
  } else {
    const hide = S.hideDone;
    const ord = [...l.order.filter(okc), ...CATS.map(c => c.n).filter(n => !l.order.includes(n))];
    let h = ord.map(n => CAT(n)).map(cc => {
      const all = its.filter(i => i.cat === cc.n);
      const vis = all.filter(i => !hide || !i.done).sort((a, b) => a.done - b.done);
      if (!vis.length) return "";
      return `<section class="grp"><h2><span>${cc.e} ${cc.n}</span><span>${brl(sum(all))}</span></h2><div class="card" style="${sty(cc)}">${vis.map(rowHTML).join("")}</div></section>`;
    }).join("");
    if (hide && done.length) {
      if (done.length === its.length) h = '<div class="empty"><b>Tudo no carrinho! 🎉</b>Todos os itens desta lista já foram marcados.</div>';
      h += `<button class="more" id="showDone">${plural(done.length, "item marcado oculto", "itens marcados ocultos")} · Mostrar</button>`;
    }
    box.innerHTML = h;
  }
  save();
}

/* =========================================================
   Ações na lista: marcar, editar, excluir (botão ou deslizar)
   ========================================================= */
const findItem = row => L().items.find(x => String(x.id) === row.dataset.id);

function delItem(it) {
  const l = L(), idx = l.items.indexOf(it);
  if (idx < 0) return;
  l.items.splice(idx, 1);
  render();
  toast(`“${it.name}” excluído`, () => { if (!l.items.includes(it)) l.items.splice(Math.min(idx, l.items.length), 0, it); });
}

let swipedAt = 0;
$("list").addEventListener("click", e => {
  if (Date.now() - swipedAt < 400) return;
  if (e.target.closest("#showDone")) { S.hideDone = false; render(); return; }
  const row = e.target.closest(".row"); if (!row || row.dataset.gone) return;
  const it = findItem(row); if (!it) return;
  if (e.target.closest("[data-d]")) {
    row.dataset.gone = 1; vib(); row.classList.add("out");
    setTimeout(() => delItem(it), reduced() ? 0 : 180);
  } else if (e.target.closest("[data-t]")) {
    it.done = !it.done; vib(); render();
  } else if (e.target.closest("[data-e]")) {
    openEdit(it);
  }
});

// Deslizar o item para a esquerda para excluir (celular)
let sw = null;
$("list").addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse" || !e.isPrimary) return;
  const row = e.target.closest(".row");
  if (!row || row.dataset.gone) return;
  sw = { row, x: e.clientX, y: e.clientY, id: e.pointerId, on: false, dx: 0 };
});
$("list").addEventListener("pointermove", e => {
  if (!sw || e.pointerId !== sw.id) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (!sw.on) {
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { sw = null; return; }
    if (!(dx < -10 && Math.abs(dx) > Math.abs(dy) * 1.5)) return;
    sw.on = true;
    try { sw.row.setPointerCapture(e.pointerId); } catch (x) {}
    sw.row.parentNode.classList.add("drag");
    sw.row.style.transition = "none";
  }
  sw.dx = Math.min(0, dx);
  sw.row.style.transform = `translateX(${sw.dx}px)`;
});
function swipeEnd(e) {
  if (!sw || e.pointerId !== sw.id) return;
  const s = sw; sw = null;
  if (!s.on) return;
  swipedAt = Date.now();
  const row = s.row, limit = Math.min(120, row.offsetWidth * .35);
  if (e.type === "pointerup" && s.dx < -limit) {
    const it = findItem(row);
    row.dataset.gone = 1; vib();
    row.style.transition = "transform .18s ease-out";
    row.style.transform = "translateX(-100%)";
    setTimeout(() => it ? delItem(it) : render(), reduced() ? 0 : 180);
  } else {
    row.style.transition = "transform .2s";
    row.style.transform = "";
    setTimeout(() => row.parentNode && row.parentNode.classList.remove("drag"), 200);
  }
}
$("list").addEventListener("pointerup", swipeEnd);
$("list").addEventListener("pointercancel", swipeEnd);

/* =========================================================
   Editar item
   ========================================================= */
let editing = null, eq = 1, eu = "un";
function setEditUnit(u) {
  eu = u;
  document.querySelectorAll("#eun button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === u));
  $("eStep").hidden = u === "kg"; $("ekgw").hidden = u !== "kg";
  $("epl").textContent = u === "kg" ? "Preço por quilo" : "Preço unitário";
}
function openEdit(it) {
  editing = it;
  $("en").value = it.name;
  eq = isKg(it) ? 1 : it.qty; $("eqv").textContent = eq;
  $("ekg").value = isKg(it) ? fmtN(it.qty, 3) : "";
  setEditUnit(it.unit);
  $("ep").value = fromC(it.price, 1);
  paint($("ec"), it.cat);
  ["en", "ep", "ekg"].forEach(id => $(id).classList.remove("bad"));
  openD("ed");
}
$("eun").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setEditUnit(b.dataset.v); });
$("eqm").onclick = () => { eq = Math.max(1, eq - 1); $("eqv").textContent = eq; };
$("eqp").onclick = () => { eq = Math.min(999, eq + 1); $("eqv").textContent = eq; };
function saveEdit() {
  const n = $("en").value.trim().slice(0, 120);
  if (!n) return bad("en");
  const q = eu === "kg" ? kilos($("ekg").value) : eq;
  if (eu === "kg" && !q) return bad("ekg");
  if (!$("ep").value) return bad("ep");
  const it = editing, oldCat = it.cat;
  if (norm(n) !== norm(it.name) || eu !== it.unit) delete it.pp;
  Object.assign(it, { name: n, qty: q, unit: eu, price: cents($("ep").value), cat: $("ec").dataset.v });
  if (it.cat !== oldCat) bump(it.cat);
  remember(it);
  $("ed").close(); render();
}
$("edSave").onclick = saveEdit;
["en", "ep", "ekg"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); saveEdit(); } }));
$("edDel").onclick = () => { const it = editing; $("ed").close(); delItem(it); };

/* =========================================================
   Adicionar item
   ========================================================= */
let qty = 1, unit = "un", autoPrice = false, hint = "";
function setUnit(u) {
  unit = u;
  const kg = u === "kg";
  $("ub").textContent = kg ? "/kg" : "/un";
  $("ub").classList.toggle("kg", kg);
  $("ub").setAttribute("aria-label", kg ? "Preço por quilo. Tocar para mudar para unidade" : "Preço por unidade. Tocar para mudar para quilo");
  $("qStep").hidden = kg; $("kgw").hidden = !kg;
  updatePreview();
}
function updatePreview() {
  const c = cents($("price").value), q = unit === "kg" ? kilos($("kg").value) : qty;
  let t = c && q && (unit === "kg" || q > 1) ? `= ${brl(Math.round(c * q))}` : "";
  if (hint) t = t ? `${hint} · ${t}` : hint;
  $("prev").textContent = t;
}
$("ub").onclick = () => { setUnit(unit === "kg" ? "un" : "kg"); if (unit === "kg") $("kg").focus(); };
$("qm").onclick = () => { qty = Math.max(1, qty - 1); $("qv").textContent = qty; updatePreview(); };
$("qp").onclick = () => { qty = Math.min(999, qty + 1); $("qv").textContent = qty; updatePreview(); };
$("kg").addEventListener("input", updatePreview);
$("price").addEventListener("input", () => { autoPrice = false; updatePreview(); });

// Ao digitar um item já comprado antes, preenche preço, unidade e categoria
$("name").addEventListener("input", () => {
  const h = S.hist[norm($("name").value)];
  if (h) {
    if (autoPrice || !$("price").value) {
      $("price").value = fromC(h.p, 1); $("price").classList.remove("bad"); autoPrice = true;
      S.cat = h.c; paint($("cat"), h.c);
      if (h.u !== unit) setUnit(h.u);
    }
    hint = `Último preço: ${brl(h.p)}${h.u === "kg" ? "/kg" : ""}`;
  } else {
    if (autoPrice) { $("price").value = ""; autoPrice = false; }
    hint = "";
  }
  updatePreview();
});

function resetForm() {
  $("name").value = ""; $("price").value = ""; $("kg").value = "";
  qty = 1; $("qv").textContent = 1; autoPrice = false; hint = "";
  setUnit("un");
}

async function add() {
  const n = $("name").value.trim().slice(0, 120);
  if (!n) { bad("name"); toast("Informe o nome do item"); return; }
  const q = unit === "kg" ? kilos($("kg").value) : qty;
  if (unit === "kg" && !q) { bad("kg"); toast("Informe o peso em kg"); return; }
  if (!$("price").value) { bad("price"); toast("Informe o preço do item"); return; }
  const price = cents($("price").value), cat = $("cat").dataset.v, l = L(), k = norm(n), u = unit;

  // Item repetido: oferece somar à quantidade existente
  const ex = l.items.find(i => norm(i.name) === k && i.unit === u);
  if (ex) {
    const r = await ask(`“${ex.name}” já está na lista`, `Já tem ${qLabel(ex.qty, u)}. Quer somar mais ${qLabel(q, u)} a esse item ou adicionar separado?`, "Somar", { cancel: "Adicionar separado" });
    if (!r) return;
    if (r === "ok") {
      const old = { qty: ex.qty, price: ex.price, done: ex.done };
      ex.qty = u === "kg" ? Math.round((ex.qty + q) * 1000) / 1000 : Math.min(999, ex.qty + q);
      ex.price = price; ex.done = false;
      remember(ex); bump(ex.cat); resetForm(); render();
      toast(`Somado a “${ex.name}”`, () => Object.assign(ex, old));
      afterAdd(); return;
    }
  }

  const h = S.hist[k], it = { id: uid(), name: n, qty: q, price, unit: u, cat, done: false };
  if (h && h.u === u && h.p && h.p !== price) it.pp = h.p;   // para mostrar se o preço subiu/caiu
  l.items.push(it);
  remember(it); bump(cat); resetForm(); render(); afterAdd();
}
function afterAdd() {
  if (matchMedia("(pointer:coarse)").matches) document.activeElement && document.activeElement.blur();
  else $("name").focus();
}
$("addBtn").onclick = add;
$("name").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $(unit === "kg" ? "kg" : "price").focus(); } });
$("kg").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("price").focus(); } });
$("price").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); add(); } });

/* =========================================================
   Sugestões de itens
   ========================================================= */
const SUG={"Hortifruti":["Banana","Maçã","Laranja","Limão","Mamão","Abacate","Manga","Alface","Couve","Rúcula","Tomate","Cebola","Alho","Batata","Cenoura","Pimentão","Pepino","Brócolis"],"Padaria":["Pão francês","Pão de forma","Pão integral","Pão de hambúrguer","Bolo de cenoura","Bolo de chocolate","Torrada integral","Croissant","Rosquinha","Pão de queijo"],"Açougue":["Carne moída","Patinho","Alcatra","Contrafilé","Costela","Peito de frango","Coxa de frango","Sobrecoxa","Filé de tilápia","Sardinha","Atum","Linguiça"],"Laticínios":["Leite integral","Leite desnatado","Queijo muçarela","Queijo prato","Requeijão","Iogurte natural","Iogurte grego","Manteiga","Margarina","Creme de leite"],"Frios e Ovos":["Ovos","Presunto","Muçarela","Peito de peru","Mortadela","Salame"],"Mercearia":["Arroz","Feijão carioca","Feijão preto","Macarrão espaguete","Macarrão parafuso","Café","Açúcar","Sal","Óleo de soja","Farinha de trigo","Farinha de mandioca","Molho de tomate","Milho em conserva","Ervilha","Aveia","Achocolatado"],"Bebidas":["Água mineral","Refrigerante cola","Refrigerante guaraná","Suco de laranja","Suco de uva","Água de coco","Cerveja","Energético","Chá gelado"],"Limpeza":["Detergente","Sabão em pó","Sabão líquido","Água sanitária","Desinfetante","Amaciante","Esponja","Limpador multiuso","Saco de lixo","Pano de chão"],"Higiene":["Papel higiênico","Creme dental","Escova de dentes","Shampoo","Condicionador","Sabonete","Desodorante","Fio dental","Absorvente","Lenço umedecido"],"Congelados":["Pizza congelada","Nuggets","Hambúrguer","Batata frita congelada","Lasanha congelada","Sorvete","Açaí"],"Snacks e Doces":["Biscoito recheado","Biscoito água e sal","Chocolate","Bombom","Barra de cereal","Salgadinho","Amendoim","Pipoca de micro-ondas"],"Pets":["Ração para cachorro","Ração para gato","Sachê para gato","Petisco para cachorro","Areia para gato","Tapete higiênico"]};
const FAV=[["Arroz","Mercearia"],["Feijão","Mercearia"],["Leite","Laticínios"],["Pão francês","Padaria"],["Ovos","Frios e Ovos"],["Banana","Hortifruti"],["Tomate","Hortifruti"],["Cebola","Hortifruti"],["Café","Mercearia"],["Açúcar","Mercearia"],["Óleo","Mercearia"],["Papel higiênico","Higiene"],["Detergente","Limpeza"]];
const chip = (n, c) => `<button class="chip" data-n="${esc(n)}" data-c="${esc(c)}">${esc(n)}</button>`;
$("hBtn").onclick = () => {
  let h = "";
  const rec = recent().slice(0, 12);
  if (rec.length) h += `<section class="sec" style="--h:200;--cs:20%"><h4>🕘 Comprados recentemente</h4><div class="sg">${rec.map(r => chip(r.n, r.c)).join("")}</div></section>`;
  h += `<section class="sec" style="--h:48"><h4>⭐ Mais comprados</h4><div class="sg">${FAV.map(([n, c]) => chip(n, c)).join("")}</div></section>`;
  CATS.forEach(c => { if (SUG[c.n]) h += `<section class="sec" style="${sty(c)}"><h4>${c.e} ${c.n}</h4><div class="sg">${SUG[c.n].map(n => chip(n, c.n)).join("")}</div></section>`; });
  $("hsl").innerHTML = h; openD("hs"); $("hsl").scrollTop = 0;
};
$("hsl").addEventListener("click", e => {
  const b = e.target.closest("[data-n]"); if (!b) return;
  S.cat = b.dataset.c; paint($("cat"), S.cat);
  $("name").value = b.dataset.n; $("name").dispatchEvent(new Event("input", { bubbles: true }));
  save(); $("hs").close();
  $(unit === "kg" ? "kg" : "price").focus();
});

/* =========================================================
   Menu de opções
   ========================================================= */
$("menuBtn").onclick = () => {
  $("bd").value = fromC(L().budget || 0);
  $("mHide").textContent = S.hideDone ? "Mostrar itens marcados" : "Ocultar itens marcados";
  applyTheme(); openD("mn");
};
$("mnOk").onclick = () => $("mn").close();
// O orçamento é salvo sempre que a janela fecha (Pronto, tocar fora ou voltar)
$("mn").addEventListener("close", () => { L().budget = cents($("bd").value); render(); });
$("mHide").onclick = () => {
  S.hideDone = !S.hideDone; $("mn").close(); render();
  toast(S.hideDone ? "Itens marcados ocultos" : "Itens marcados visíveis");
};
$("mDone").onclick = () => {
  const l = L(), old = l.items.slice();
  $("mn").close();
  if (!old.some(i => i.done)) { toast("Nenhum item marcado"); return; }
  l.items = l.items.filter(i => !i.done); render();
  toast("Itens marcados removidos", () => { l.items = old; });
};
$("mAll").onclick = () => {
  const l = L(), old = l.items.slice();
  $("mn").close();
  if (!old.length) { toast("A lista já está vazia"); return; }
  l.items = []; render();
  toast("Lista limpa", () => { l.items = old; });
};
$("mExp").onclick = () => { $("mn").close(); $("xShare").hidden = !navigator.share; openD("ex"); };

/* =========================================================
   Várias listas
   ========================================================= */
function renderLists() {
  $("lsl").innerHTML = S.lists.map(l => `<button class="opt plain${l.id === S.cur ? " on" : ""}" data-l="${esc(l.id)}"><span class="e">🛒</span><span class="ln">${esc(l.name)}</span><em>${plural(l.items.length, "item", "itens")} · ${brl(sum(l.items))}</em></button>`).join("");
  $("lDel").hidden = S.lists.length < 2;
}
$("lsBtn").onclick = () => { renderLists(); openD("ls"); };
$("lsOk").onclick = () => $("ls").close();
$("lsl").addEventListener("click", e => {
  const b = e.target.closest("[data-l]"); if (!b) return;
  S.cur = b.dataset.l; $("ls").close(); render();
});
$("lNew").onclick = async () => {
  const n = await askName("Nova lista", ""); if (!n) return;
  const l = newList(n); S.lists.push(l); S.cur = l.id;
  $("ls").close(); render(); toast(`Lista “${n}” criada`);
};
$("lRen").onclick = async () => {
  const n = await askName("Renomear lista", L().name); if (!n) return;
  L().name = n; renderLists(); render();
};
$("lDel").onclick = async () => {
  const l = L();
  const r = await ask(`Excluir “${l.name}”?`, l.items.length ? `Os ${plural(l.items.length, "item", "itens")} desta lista serão apagados.` : "A lista está vazia.", "Excluir", { danger: true });
  if (r !== "ok") return;
  const idx = S.lists.indexOf(l);
  S.lists.splice(idx, 1); S.cur = S.lists[Math.max(0, idx - 1)].id;
  $("ls").close(); render();
  toast(`Lista “${l.name}” excluída`, () => { S.lists.splice(idx, 0, l); S.cur = l.id; });
};

/* =========================================================
   Exportar, compartilhar e backup
   ========================================================= */
const HEAD = ["Categoria", "Item", "Quantidade", "Unidade", "Preço unitário", "Subtotal", "No carrinho"];
const rows = () => L().items.map(i => [CAT(i.cat).n, i.name, i.qty, isKg(i) ? "kg" : "un", i.price / 100, sub(i) / 100, i.done ? "Sim" : "Não"]);
const totalR = () => sum(L().items) / 100;
const fileBase = () => "lista-" + slug(L().name);

function listText() {
  const l = L();
  const body = CATS.map(cc => {
    const its = l.items.filter(i => i.cat === cc.n);
    return its.length ? `${cc.e} ${cc.n}\n` + its.map(i => `${i.done ? "[x]" : "[ ]"} ${isKg(i) ? fmtN(i.qty, 3) + " kg" : i.qty + "x"} ${i.name} - ${brl(sub(i))}`).join("\n") : "";
  }).filter(Boolean).join("\n\n");
  return `🛒 ${l.name}\n\n${body}\n\nTotal: ${brl(sum(l.items))}`;
}

function download(name, data) {
  $("ex").close();
  try {
    const type = name.endsWith(".csv") ? "text/csv;charset=utf-8" : name.endsWith(".json") ? "application/json" : "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
    const u = URL.createObjectURL(new Blob([data], { type })), a = document.createElement("a");
    a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 5000);
    toast("Arquivo exportado");
  } catch (e) { toast("Não foi possível exportar"); }
}

$("xShare").onclick = async () => {
  $("ex").close();
  try { await navigator.share({ title: L().name, text: listText() }); }
  catch (e) { if (e.name !== "AbortError") toast("Não foi possível compartilhar"); }
};
$("xCopy").onclick = async () => {
  const tx = listText(); $("ex").close();
  try { await navigator.clipboard.writeText(tx); toast("Lista copiada"); }
  catch (e) {
    const a = document.createElement("textarea"); a.value = tx; document.body.appendChild(a); a.select();
    try { document.execCommand("copy"); toast("Lista copiada"); } catch (x) { toast("Não foi possível copiar"); }
    a.remove();
  }
};
$("xCsv").onclick = () => {
  const q = v => `"${String(v).replace(/"/g, '""')}"`, f = (n, d = 2) => fmtN(n, d).replace(/\./g, "");
  const lines = [HEAD, ...rows().map(r => [r[0], r[1], r[3] === "kg" ? f(r[2], 3) : r[2], r[3], f(r[4]), f(r[5]), r[6]]), ["", "", "", "", "Total", f(totalR()), ""]]
    .map(r => r.map(q).join(";"));
  download(fileBase() + ".csv", "\ufeff" + lines.join("\r\n"));
};
const loadXLSX = () => window.XLSX ? Promise.resolve() : new Promise((ok, no) => {
  const s = document.createElement("script"); s.src = "xlsx.full.min.js"; s.onload = ok; s.onerror = no; document.head.appendChild(s);
});
$("xXls").onclick = async () => {
  try { await loadXLSX(); } catch (e) { $("ex").close(); toast("Não foi possível gerar a planilha (precisa de internet na 1ª vez)"); return; }
  const n = L().items.length, ws = XLSX.utils.aoa_to_sheet([HEAD, ...rows(), ["", "", "", "", "Total", totalR(), ""]]);
  ws["!cols"] = [{ wch: 16 }, { wch: 30 }, { wch: 11 }, { wch: 9 }, { wch: 14 }, { wch: 12 }, { wch: 12 }];
  for (let r = 2; r <= n + 2; r++) ["E", "F"].forEach(c => { if (ws[c + r] && typeof ws[c + r].v === "number") ws[c + r].z = '"R$" #,##0.00'; });
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Lista");
  download(fileBase() + ".xlsx", XLSX.write(wb, { type: "array", bookType: "xlsx" }));
};
$("xBak").onclick = () => download("backup-lista-de-compras.json", JSON.stringify(S, null, 1));
$("xRes").onclick = () => $("xFile").click();
$("xFile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  let d;
  try { d = cleanState(JSON.parse(await f.text())); }
  catch (x) { $("ex").close(); toast("Arquivo de backup inválido"); return; }
  const n = d.lists.reduce((a, l) => a + l.items.length, 0);
  const r = await ask("Restaurar backup?", `O arquivo tem ${plural(d.lists.length, "lista", "listas")} e ${plural(n, "item", "itens")}. Suas listas atuais serão substituídas.`, "Restaurar", { danger: true });
  if (r !== "ok") return;
  const old = S; S = d;
  $("ex").close(); refreshAll();
  toast("Backup restaurado", () => { S = old; refreshAll(); });
};
function refreshAll() { paint($("cat"), S.cat); applyTheme(); fillDatalist(); render(); }

/* =========================================================
   Instalação do app
   ========================================================= */
let deferredPrompt = null;
const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function instUI() {
  const on = !standalone(); $("mInst").hidden = !on;
  let x = false; try { x = localStorage.getItem("inst-x") === "1"; } catch (e) {}
  $("inst").hidden = !(on && !x && (deferredPrompt || ios));
}
addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; instUI(); });
addEventListener("appinstalled", () => { deferredPrompt = null; instUI(); toast("App instalado"); });
async function install() {
  if ($("mn").open) $("mn").close();
  if (deferredPrompt) { deferredPrompt.prompt(); try { await deferredPrompt.userChoice; } catch (x) {} deferredPrompt = null; instUI(); return; }
  $("ihT").textContent = ios ? "Instalar no iPhone" : "Instalar o app";
  $("ihP").innerHTML = ios ? "Toque em <b>Compartilhar</b> (o quadrado com a seta) na barra do navegador e escolha <b>Adicionar à Tela de Início</b>." : "No menu do navegador (⋮), escolha <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.";
  openD("ih");
}
$("mInst").onclick = install; $("instGo").onclick = install;
$("instX").onclick = () => { try { localStorage.setItem("inst-x", "1"); } catch (e) {} instUI(); };

/* =========================================================
   Início
   ========================================================= */
setUnit("un");
refreshAll();
instUI();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
